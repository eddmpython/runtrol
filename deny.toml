# 공급망 게이트 + **기각한 crate 의 기계 기억**.
#
# 두 번째 역할이 중요하다. 설계 문서에 "sled 를 쓰지 않는다" 를 적어도 다음 사람은 안 읽는다.
# 여기 적으면 `cargo deny` 가 막는다. 기각 이유는 mainPlan 문서에서 왔고 `use-instead` 로 남긴다.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# 아래는 전부 **데스크톱 셸 (Tauri v2) 이 데려온 것**이고 우리가 고를 수 있는 것이 아니다. 셸 선택의
# 대가로 기록한다 (`docs/desktopGui.md` "Supply-chain cost"). 하나하나 이유 없이 넣지 않는다.
#
# 이것은 게이트를 약하게 만드는 것이 아니라 게이트가 알려준 값을 장부에 적는 것이다. 취약점 (vulnerability)
# 은 하나도 없다. 전부 unmaintained 표시이고, 대부분 Linux 백엔드 전용이라 Windows 빌드에 없다.
# 새 취약점은 여전히 red 가 된다.
ignore = [
    # gtk-rs 의 GTK3 바인딩 열 개. Tauri 의 Linux 백엔드가 쓰고 Windows 빌드에는 들어오지 않는다.
    # upstream 이 GTK4 로 옮기기 전에는 우리가 할 수 있는 것이 없고, Linux 배포는 아직 없다 (README "준비 중").
