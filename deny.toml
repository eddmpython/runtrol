[licenses]
version = 2
# MIT 프로젝트가 무리 없이 배포할 수 있는 것만.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # 파일 단위 카피레프트다. **바이너리에 넣어 MIT 로 배포하는 데 제약이 없고**, 의무는 그 파일들을
    # 고쳤을 때 그 파일의 소스를 공개하는 것뿐이다. 우리는 고치지 않는다.
    # 데스크톱 셸이 데려온다 (cssparser · selectors · dtoa-short · option-ext, 전부 Tauri 경유).
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 중복 버전은 경고까지. 트리 전체를 우리가 통제하지 못한다.
multiple-versions = "warn"
# 와일드카드 버전은 재현 빌드를 깨뜨린다. 릴리즈 서명의 전제다.
wildcards = "deny"
# Exempt this workspace's own `{ path = ... }` edges. They read as wildcards because they carry no
# version, and for a third-party crate that would indeed break a reproducible build. For a path
# dependency inside one repository the resolution is pinned by the commit itself, so denying it would
# only teach everyone to write a version number that means nothing. Every member is `publish = false`,
# which is the condition cargo-deny requires before granting this.
allow-wildcard-paths = true

# Rejected dependency ledger. Each entry carries or links its reason.
[[bans.deny]]
name = "sled"
reason = "sled has unresolved durability and RSS concerns. See docs/coreRuntime.md"
use-instead = "redb"

[[bans.deny]]
name = "async-std"
reason = "RUSTSEC-2025-0052 로 discontinued (전 버전 영향, 패치 없음)"
use-instead = "tokio"

[[bans.deny]]
name = "native_db"
reason = "redb 를 `=3.0.2` 로 핀해서 4.1 의 메모리 개선(-68%)을 못 받는다. 마지막 릴리즈 12 개월 경과"
use-instead = "redb"

[[bans.deny]]
name = "linkme"
reason = "crate 경계를 넘으면 조용히 빈 슬라이스를 반환한다 (실측). 조용한 실패는 CLAUDE.md 금지 사항. docs/providerArchitecture.md 의 명시적 driver registry 원칙"

[[bans.deny]]
name = "enum_dispatch"
reason = "닫힌 enum 디스패치는 provider 추가 시 코어 수정을 강제한다 (vibe-kanban 안티패턴)"

[[bans.deny]]
name = "libloading"
reason = "동적 플러그인 ABI 는 아직 없는 문제에 메모리와 보안 비용을 문다. manifest + kind 드라이버로 충분하다"

[[bans.deny]]
name = "wasmtime"
reason = "바이너리 크기를 두 배로 만든다. 플러그인 격리는 M0 문제가 아니다"

[[bans.deny]]
name = "openssl"
reason = "네이티브 의존을 끌어와 단일 정적 바이너리와 크로스 플랫폼 설치 동등성을 깬다"
use-instead = "rustls"

[[bans.deny]]
name = "dirs"
reason = "2025-02 GitHub archive 됨. dirs-sys 가 windows-sys 0.59 를 핀해 tokio 의 0.61 과 트리가 갈라진다. 경로 해소는 우리가 소유한다 (약 40 줄)"
# **금지는 그대로다.** 우리가 직접 의존하는 것은 여전히 막힌다. 예외는 하나, 데스크톱 셸이다:
# tauri 가 직접 의존하고 우리가 고를 수 없다. 이렇게 적으면 다른 어떤 경로로 들어오는 것도 계속 red 다.
# 원래 금지 이유 중 "경로 해소는 우리가 소유한다" 는 손대지 않았고, 버전 갈라짐은 multiple-versions 가 본다.
#
# 세 부모를 전부 적는다. 게이트가 하나라도 빠지면 "이 부모는 wrapper 로 표시되지 않았다" 고 알려주므로,
# 셸이 다른 경로로 이것을 데려오기 시작하면 그때 다시 red 가 된다. 목록을 좁게 유지하는 것이 요점이다.
wrappers = ["tauri", "tauri-build", "wry"]

[[bans.deny]]
name = "directories"
reason = "위와 같음 (같은 archive)"
