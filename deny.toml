    { id = "RUSTSEC-2024-0420", reason = "gtk3 바인딩. 위와 같음" },
    # 매크로·유니코드 보조 crate. 빌드 시점에만 쓰이거나 데이터 표이고, 취약점이 아니라 유지보수 중단 표시다.
