# runtrol 워크스페이스 루트. 가상 매니페스트 (루트 자체는 crate 가 아니다).
#
# 여기가 정본인 것: 멤버 목록, 제3자 의존 버전, lint 표, 프로파일.
# 여기가 정본이 아닌 것: 의존 방향 (그건 `tests/audit/dependencyDirection.rs` 의 표가 강제한다).

[workspace]
resolver = "3"
members = [
    "crates/runtrol-provider",
    "crates/runtrol-security",
    "crates/runtrol-childproc",
    "crates/runtrol-store",
    "crates/runtrol-ipc",
    "crates/runtrol-transport",
    "crates/runtrol-vault",
    "crates/runtrol-core",
    "crates/runtrol-drivers",
    "crates/runtrol-daemon",
    "crates/runtrol-cli",
    "crates/runtrol-gui",
    "crates/runtrol",
    "tests/audit",
]

[workspace.package]
edition = "2024"
# rust-toolchain.toml 의 핀과 같은 값. MSRV 를 증명하는 CI 잡이 없으면 더 낮은 값은
# 검증되지 않은 주장이므로 적지 않는다 (더 낮은 MSRV 를 원하면 그것을 검증하는 잡을 먼저 만든다).
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eddmpython/runtrol"
authors = ["eddmpython"]

# 제3자 버전은 여기 한 번만 적는다 (버전 SSOT). 멤버는 `workspace = true` 로 상속한다.
#
# **이 표는 선언 시점이 아니라 첫 사용 시점에 자란다.** 미리 박아둔 항목은 CLAUDE.md 가 금지한
# "나중에 쓸" 그 자체이고, `cargo shear` 가 (셋 중 유일하게 이 표를 보므로) 곧바로 red 를 낸다.
# 새 항목은 그것을 쓰는 crate 를 추가하는 커밋에서 함께 들어온다. 그러면 버전 한 줄마다
# 리뷰 가능한 이유가 동행한다. 오늘 라이브 인덱스에 대해 해소를 확인한 판본 목록은
# `.claude/discussion/r2/crateTopology.md` 0 절에 남아 있다.
[workspace.dependencies]
# Shared event payloads are reference-counted across watchers. See docs/coreRuntime.md.
bytes = "1.12.1"

# 직렬화. serde_json 의 preserve_order 는 절대 켜지 않는다 (워크스페이스 전역 오염).
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
# Provider manifests. `preserve_order` 는 켜지 않는다 (indexmap 이 전역으로 딸려온다).
toml = { version = "1.1.4", default-features = false }

# 식별자·경로·오류.
uuid = { version = "1.24.0", default-features = false }
# OS 난수. `uuid` 가 부르는 그 crate 를 직접 부른다 (UUIDv7 의 상위 난수 비트는 같은 밀리초 안에서
# 단조 증가하므로 난수원으로 쓸 수 없다. 실측).
getrandom = "0.4.3"
camino = "1.2.5"
thiserror = "2.0.19"

# 프로세스. PATH 조회는 손으로 쓰지 않는다 (PATHEXT 순서·인용된 PATH 항목·Unix 실행 비트).
which = { version = "8.0.4", default-features = false }

# 트레이트의 async 메서드. `Box<dyn Provider>` 가 필요하고 (kind 표가 그것을 돌려준다) native
# async fn 은 dyn 이 안 된다. 런타임 비용 0, 매크로 하나.
async-trait = "0.1.91"

# Runtime features stay opt-in per member. Unused features add code and OS threads. See docs/coreRuntime.md.
tokio = { version = "1.53.1", default-features = false }

# Phone-facing HTTP. The guard wraps the connection before routing, so Host, Origin, browser metadata, and
# authentication are checked for every route including errors and upgrades.
hyper = { version = "1.11.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
http-body-util = { version = "0.1.4", default-features = false }

# End-to-end phone channel. The negotiated suite is AES-GCM only. `snow` 0.10.0's AES resolver gets its shared
# `KeyInit` import behind the ChaCha feature, so that feature is also required for this release to compile even
# though no protocol parameter selects it. A 128-bit QR secret is domain-separated into Noise's required 32-byte
# PSK and secret buffers clear on drop.
snow = { version = "0.10.0", default-features = false, features = ["use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
hkdf = { version = "0.12.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

# Metadata store with no background worker. Version 4.1 includes the region allocator RSS fix and is the floor.
# Earlier versions also use a different variable-width tuple encoding. See docs/coreRuntime.md.
redb = "4.1.0"

# 플랫폼. job object (Windows) 와 fork-exec 사이 시스템 콜 (Unix).
windows-sys = "0.61.2"
libc = "0.2"

# 데스크톱 셸. `tests/_attempts/desktopShell` 실측으로 골랐다 (`docs/desktopGui.md`): 초당 3,000 줄에서
# 프레임 예산을 지키고 (egui p95 106ms 대 14ms), 한글 IME 를 통과하며, 랜딩·PWA 와 컴포넌트 층을 공유한다.
tauri = "2"
tauri-build = "2"

# 게이트 전용 (dev).
cargo_metadata = "0.23.1"

# 내부 crate. 경로 의존이고 버전은 워크스페이스가 함께 움직인다.
runtrol-provider = { path = "crates/runtrol-provider" }
runtrol-security = { path = "crates/runtrol-security" }
runtrol-childproc = { path = "crates/runtrol-childproc" }
runtrol-store = { path = "crates/runtrol-store" }
runtrol-ipc = { path = "crates/runtrol-ipc" }
runtrol-transport = { path = "crates/runtrol-transport" }
runtrol-vault = { path = "crates/runtrol-vault" }
runtrol-core = { path = "crates/runtrol-core" }
runtrol-drivers = { path = "crates/runtrol-drivers" }
runtrol-daemon = { path = "crates/runtrol-daemon" }
runtrol-cli = { path = "crates/runtrol-cli" }
runtrol-gui = { path = "crates/runtrol-gui" }

# lint 표. 멤버는 `[lints] workspace = true` 로 상속한다.
# **주의 (실측)**: `[lints] workspace = true` 와 per-crate 재정의는 공존할 수 없다
# (cargo 가 "cannot override `workspace.lints` in `lints`" 로 hard error).
# 그래서 재정의가 필요한 crate 는 자기 표를 통째로 쓴다. 어느 crate 가 그러는지는
# `tests/audit/workspaceLints.rs` 가 고정한다.
[workspace.lints.rust]
# 검토된 플랫폼 FFI crate 만 "deny" 로 완화한다. 현재는 자식 프로세스 격리와 Windows DPAPI 경계다.
unsafe_code = "forbid"
# clippy 에서 rustc 로 승격된 lint 다. `[workspace.lints.clippy]` 에 적으면 경고가 난다.
let_underscore_drop = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
# 모든 `pub` 은 계약이므로 자기 설명을 동반한다.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# mod.rs 스타일. 한 관심사 = 한 디렉토리.
self_named_module_files = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The supervisor survives one task panic. This keeps the release default explicit and prevents a future abort switch.
# See docs/coreRuntime.md.
panic = "unwind"
# debuginfo 만 버리고 심볼은 남긴다. 패닉 백트레이스가 함수 이름을 말해야
# 버그 리포트가 쓸모 있다. 데몬에서 이건 타협 대상이 아니다.
strip = "debuginfo"
debug = false
incremental = false

[profile.dev]
# Windows 링크 시간을 줄이면서 백트레이스는 살린다.
debug = "line-tables-only"

# Reproduces the runtime comparison conditions behind docs/coreRuntime.md.
# panic="abort" and strip=true are measurement conditions, not the product profile. Keeping this separate prevents
# anyone from changing release settings to match a footprint experiment.
[profile.measure]
inherits = "release"
panic = "abort"
strip = true
