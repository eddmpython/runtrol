# North Star board. What is scored, what it currently scores, and what evidence is claimed for it.
#
# This file holds machine facts only: the axis name in each of the four README languages, the
# evidence a score is computed from, and which gates back which axis. The prose for what a gate
# asserts lives in `docs/northStarEvidence.md`. `board.py` checks that the two name sets are
# identical in both directions, so neither file can grow an entry the other never heard of.
#
# Two kinds of thing live here and they never mix:
#
#   axis    scored 0~10 and summed into the board total. one per outcome a user can feel.
#   floor   binary. modularity, clean code, security, hygiene, budget. red blocks a merge and is
#           never worth a fraction of a point, because a floor rule at 7/10 is a floor rule being
#           broken. splitting these into named gates is how they get finer, not by scoring them.
#
# A third kind is deliberately absent. Innovation gets no number: the immutable North Star is the
# combined outcome of the axis list, so a separate score would count it twice and no single gate can
# assert it. Whether the product still points there is a kill criterion in `docs/positioning.md`.
#
# Editing rules, all of them enforced by `board.py`:
#   - a tier above `manual` names gates that exist as files and run in active hosted CI
#   - additives attach only at the top tier, and each one needs a gate of a matching kind
#   - a `planned` floor must not exist as a file yet. building it flips the status in that commit

# ----------------------------------------------------------------------------------------------
# Scored axes. Order is the order the README tables print them in, and `readmeParity` holds all
# four languages to it.
# ----------------------------------------------------------------------------------------------

[[axis]]
key = "oneSessionList"
# Hosted Windows CI drives the production browser lifecycle and the actual Tauri product against
# deterministic counterparts. Those counterparts are mocks, so this axis stops at the mock tier.
tier = "mock"
additives = []
name = { ko = "하나의 세션 목록", en = "One session list", zh = "统一的会话列表", ja = "一つのセッション一覧" }
gate = [
    { name = "desktopLifecycleSmoke", kind = "smoke" },
    { name = "actualShellSmoke", kind = "smoke" },
    { name = "sessionLifecycleSmoke", kind = "operator" },
]

[[axis]]
key = "instantResponse"
tier = "mock"
additives = []
name = { ko = "즉시 반응", en = "Instant response", zh = "即时响应", ja = "即座の反応" }
gate = [
    { name = "interactionLatencyBudget", kind = "bench" },
    { name = "scrollUnderLoadSmoke", kind = "smoke" },
    { name = "desktopConvenienceSmoke", kind = "smoke" },
    { name = "desktopTextInputSmoke", kind = "smoke" },
    { name = "desktopImeSmoke", kind = "operator" },
]

[[axis]]
key = "phoneReachesPc"
tier = "none"
additives = []
name = { ko = "폰에서 내 PC 세션 잇기", en = "Reach my PC sessions from my phone", zh = "用手机接续电脑上的会话", ja = "スマホから自分の PC のセッションへ" }
gate = [
    { name = "phoneDrivesPcSmoke", kind = "smoke" },
    { name = "iosInstallAndPush", kind = "operator" },
]

[[axis]]
key = "providerExtensibility"
# Hosted CI compiles the public contract, runs the generic fixture on three operating systems, and drives an
# independently distributed ACP implementation against a local mock model. A real Claude Code process also completes
# its hidden approval denial round trip against a loopback model. The model counterparts remain mock, so the tier stays.
tier = "mock"
additives = []
name = { ko = "공급자 확장성", en = "Provider extensibility", zh = "供应商可扩展性", ja = "プロバイダー拡張性" }
gate = [
    { name = "providerContract", kind = "contract" },
    { name = "agentSurfaceDrift", kind = "smoke" },
    { name = "genericAcpSmoke", kind = "smoke" },
    { name = "externalAcpSmoke", kind = "smoke" },
    { name = "claudeApprovalSmoke", kind = "smoke" },
]

[[axis]]
key = "noConversationPassthrough"
# A real loopback socket and the production Noise boundary run under one contract gate. A live phone and relay
# smoke is the missing gate kind, so this axis cannot pass six yet.
tier = "realOneKind"
additives = []
name = { ko = "대화 무통과", en = "No conversation passthrough", zh = "对话不经过", ja = "会話を通さない" }
gate = [{ name = "egressContract", kind = "contract" }]

[[axis]]
key = "approveFromPhone"
tier = "none"
additives = []
name = { ko = "폰에서 승인", en = "Approve from the phone", zh = "在手机上批准", ja = "スマホで承認" }
gate = [{ name = "approvalRoundtripSmoke", kind = "smoke" }]

[[axis]]
