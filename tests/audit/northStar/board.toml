# North Star board. What is scored, what it currently scores, and what evidence is claimed for it.
#
# This file holds machine facts only: the axis name in each of the four README languages, the
# evidence a score is computed from, and which gates back which axis. The prose for what a gate
# asserts lives in `docs/northStarEvidence.md`. `board.py` checks that the two name sets are
# identical in both directions, so neither file can grow an entry the other never heard of.
#
# Two kinds of thing live here and they never mix:
#
#   axis    scored 0~10 and summed into the board total. one per outcome a user can feel.
#   floor   binary. modularity, clean code, security, hygiene, budget. red blocks a merge and is
#           never worth a fraction of a point, because a floor rule at 7/10 is a floor rule being
#           broken. splitting these into named gates is how they get finer, not by scoring them.
#
# A third kind is deliberately absent. Innovation gets no number: it is the axis list itself
# ("manage several AI agents in one place"), so a separate score would count it twice, and no gate
# can assert it. Whether it still holds is a kill criterion in `docs/positioning.md`.
#
# Editing rules, all of them enforced by `board.py`:
#   - a tier above `manual` names gates that exist as files and are reachable from a runner
#   - additives attach only at the top tier, and each one needs a gate of a matching kind
#   - a `planned` floor must not exist as a file yet. building it flips the status in that commit

# ----------------------------------------------------------------------------------------------
# Scored axes. Order is the order the README tables print them in, and `readmeParity` holds all
# four languages to it.
# ----------------------------------------------------------------------------------------------

[[axis]]
key = "oneSessionList"
# The real CLIs, driven end to end by the executable an operator runs, on every preflight. One kind of gate and
# no more: what is missing to go past six is a static contract check on the listing surface, not more runs of
# this one. What the live gate does not reach (a resume that succeeds, which needs a conversation with a turn
# in it) is stated in `docs/northStarEvidence.md` and said out loud by the gate on every run.
tier = "realOneKind"
additives = []
caps = []
name = { ko = "하나의 세션 목록", en = "One session list", zh = "统一的会话列表", ja = "一つのセッション一覧" }
gate = [{ name = "sessionLifecycleSmoke", kind = "smoke" }]

