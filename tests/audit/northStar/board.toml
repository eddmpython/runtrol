name = { ko = "끊겨도 살아남기", en = "Survive disconnection", zh = "断了也活着", ja = "切れても生き残る" }
gate = [{ name = "remoteResilienceFaultInjection", kind = "smoke" }]

[[axis]]
key = "costOfRunning"
# Hosted CI measures a real idle daemon's RSS and process CPU time on all three operating systems. Release-live cost
# remains unmeasured. The score ceiling itself comes from the absence of a second independent evidence kind.
tier = "realOneKind"
additives = []
name = { ko = "상주 비용", en = "Cost of running", zh = "常驻成本", ja = "常駐コスト" }
gate = [
    { name = "idleFootprintRatchet", kind = "bench" },
    { name = "guiMemoryContract", kind = "bench" },
]

[[axis]]
key = "sameMethodEverywhere"
tier = "none"
additives = []
name = { ko = "어디서나 같은 방법", en = "Same method everywhere", zh = "到哪都一样", ja = "どこでも同じやり方" }
gate = [{ name = "crossPlatformMatrix", kind = "smoke" }]

[[axis]]
key = "currentWithoutAsking"
tier = "none"
additives = []
name = { ko = "알아서 최신", en = "Current without asking", zh = "自动保持最新", ja = "勝手に最新" }
gate = [
    { name = "cliUpdateRehearsal", kind = "smoke" },
    { name = "appUpdateRehearsal", kind = "smoke" },
]

[[axis]]
key = "automaticModelDetection"
# Current real CLIs run without credentials in hosted CI. This proves one live discovery kind, while
# account-backed availability remains local evidence and no separate static contract is registered.
tier = "realOneKind"
additives = []
name = { ko = "모델 자동 인식", en = "Automatic model detection", zh = "自动识别模型", ja = "モデル自動認識" }
gate = [{ name = "modelDetectionSmoke", kind = "smoke" }]

[[axis]]
key = "sessionsDoNotTrample"
# Hosted CI uses real filesystem repository metadata and the production Core admission path. The provider process is a
# deterministic fixture, so this axis stops at the mock tier.
tier = "mock"
additives = []
name = { ko = "세션끼리 안 밟기", en = "Sessions do not trample each other", zh = "会话之间不互踩", ja = "セッション同士が踏まない" }
gate = [{ name = "sessionOverlapGuard", kind = "smoke" }]

[[axis]]
key = "agentsConsultEachOther"
# The toggle wires the two real CLIs through their own commands and was run whole by hand on
# 2026-08-03, including one real mid-turn reception. The gate drives the real subscription CLIs, so
# like the session lifecycle gate it runs on the operator's machine and cannot back a score from
# hosted CI. The tier is manual until a CI-runnable counterpart exists.
tier = "manual"
additives = []
name = { ko = "AI 끼리 서로 자문", en = "Agents consult each other", zh = "AI 互相咨询", ja = "AI 同士が相談し合う" }
gate = [{ name = "crossConsultSmoke", kind = "operator" }]

[[axis]]
key = "freedomToLeave"
# The provider is a real child process and the whole product boundary is exercised, but the counterpart is
# still the deterministic ACP fixture rather than an account-backed provider. That supports the mock tier.
tier = "mock"
additives = []
name = { ko = "떠날 자유", en = "Freedom to leave", zh = "离开的自由", ja = "去る自由" }
gate = [{ name = "uninstallLeavesNoTrace", kind = "smoke" }]

# ----------------------------------------------------------------------------------------------
# Floor gates. Binary, never scored, never summed. `status = "built"` means hosted CI invokes it
# today. `status = "planned"` means it is specified and does not exist, and `board.py` goes red if
# a planned gate quietly appears as a file without the status being flipped.
#
# The categories are what "modularity" and "clean code" look like once they are made checkable:
# not a fraction of a point each, but a named gate per rule, green or red.
# ----------------------------------------------------------------------------------------------

