<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101514">
    <meta name="color-scheme" content="dark light">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: wss:; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
    <meta name="description" content="A scoped, end-to-end encrypted phone control surface for runtrol.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/vendor/xterm/xterm.css">
    <script type="module" src="src/app.js"></script>
    <title>runtrol phone</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to sessions</a>
    <header>
      <a class="brand" href="../" aria-label="runtrol home">
        <img class="brand-dark" src="assets/brand/lockup-dark.svg" width="153" height="32" alt="runtrol">
        <img class="brand-light" src="assets/brand/lockup-light.svg" width="153" height="32" alt="runtrol">
      </a>
      <span id="connection-status" data-state="connecting" aria-live="polite">Starting</span>
      <button id="panic" class="panic" type="button">Stop all</button>
    </header>

    <main id="main">
      <section id="setup" class="setup" aria-live="polite"></section>

      <section id="sessions-view" class="shell" hidden>
        <nav class="session-pane" aria-label="PC control">
          <div class="surface-tabs" aria-label="Phone surfaces">
            <button id="show-sessions" type="button" aria-pressed="true">Sessions</button>
            <button id="show-missions" type="button" aria-pressed="false" hidden>Missions <span id="mission-signal-count" class="signal-count" hidden>0</span></button>
          </div>
          <div id="session-browser">
            <div class="pane-heading">
              <div><p class="eyebrow">SESSIONS</p><h1><span id="session-count">0</span> on this PC</h1></div>
              <div class="pane-actions">
                <button id="next-attention" class="attention" type="button" hidden>Needs you <span id="attention-count">0</span></button>
                <button id="refresh" type="button">Refresh</button>
              </div>
            </div>
            <div id="usage-strip" class="usage-strip" aria-label="Agent usage" hidden></div>
            <div id="session-list" class="session-list"></div>
            <form id="new-session" class="new-session">
              <h2>Start a session</h2>
              <label>Provider<select id="new-provider"></select></label>
              <label>Approved workspace<select id="new-workspace"></select></label>
              <p id="new-session-help" class="quiet"></p>
              <button id="start-session" type="submit">Start</button>
            </form>
          </div>
          <div id="mission-browser" hidden>
            <div class="pane-heading">
              <div><p class="eyebrow">MISSIONS</p><h1><span id="mission-count">0</span> on this PC</h1></div>
              <button id="refresh-missions" type="button">Refresh</button>
            </div>
            <div id="mission-list" class="mission-list"></div>
          </div>
        </nav>

        <section id="session-detail" class="session-detail" hidden>
          <div class="detail-heading">
            <button id="back-to-sessions" class="back" type="button">Sessions</button>
            <div>
              <p class="eyebrow" id="selected-provider"></p>
              <h2 id="selected-title"></h2>
              <p id="selected-workspace" class="path"></p>
            </div>
            <div class="detail-actions">
              <button id="interrupt" type="button">Interrupt</button>
              <button id="delete-session" type="button">Remove</button>
            </div>
          </div>
          <div class="terminal-pane">
            <div id="terminal-note" class="terminal-note" role="status" hidden></div>
            <div id="terminal" class="terminal" aria-label="The conversation, as the coding service draws it"></div>
          </div>
        </section>

        <section id="mission-detail" class="mission-detail" hidden>
          <div class="detail-heading">
            <button id="back-to-missions" class="back" type="button">Missions</button>
            <div>
              <p class="eyebrow" id="selected-mission-state"></p>
              <h2 id="selected-mission-title"></h2>
              <p id="selected-mission-project" class="path"></p>
            </div>
            <div class="detail-actions">
              <button id="pause-mission" type="button">Pause</button>
              <button id="resume-mission" type="button">Resume safely</button>
              <button id="cancel-mission" type="button">Cancel</button>
            </div>
          </div>
          <div class="mission-content">
            <div id="mission-flight-signal" class="mission-flight-signal" role="status" hidden></div>
            <dl class="mission-summary">
              <dt>Tasks passed</dt><dd id="mission-progress"></dd>
              <dt>Awaiting PC input</dt><dd id="mission-awaiting"></dd>
              <dt>Reviewed source</dt><dd id="mission-source"></dd>
              <dt>Policy digest</dt><dd id="mission-policy"></dd>
            </dl>
            <div id="mission-tasks" class="mission-tasks"></div>
          </div>
        </section>
      </section>
    </main>

    <footer>
      <span>Provider-owned conversation</span>
      <div class="footer-actions">
        <button id="notifications" type="button" hidden>Enable notifications</button>
        <button id="forget-device" type="button">Forget this PC</button>
      </div>
    </footer>
  </body>
</html>
