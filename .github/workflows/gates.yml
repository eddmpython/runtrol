# CI 쪽 게이트 목록. **로컬 러너는 이 파일을 읽지 않는다.**
#
# (이전 판의 이 주석은 로컬이 이 파일을 읽는다고 적어 두었으나 사실이 아니었다.
#  `tests/audit/preflight.py` 는 자기 `GATES` 표를 갖는다. 두 목록이 갈라지면 한쪽 green 이
#  다른 쪽 green 과 다른 뜻이 되므로, 두 목록이 일치하는지를 `tests/audit/gateCoverage.py` 가
#  게이트로 강제한다. 즉 정본은 두 개이고 그 일치가 기계 검사 대상이다.)
#
# 실행 층이 갈려 있는 이유는 `docs/northStarEvidence.md` 를 본다. 계정 기반 턴은 사람의 구독
# 인증이 필요해 hosted 러너에 실을 수 없다. 자격증명이 필요 없는 CLI 자기기술과 loopback 여정은
# hosted 러너에서 고정 판본과 최신 판본으로 검증한다.
#
# **부트스트랩 규약**: `Cargo.toml` 이 아직 없으면 cargo 단계는 건너뛴다. 단
# 조용히 건너뛰지 않고 "이 표면은 검증되지 않았다" 를 로그와 요약에 남긴다
# (`tests/audit/preflight.py` 와 같은 정직성 규약).

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: gates-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || 'ordinary' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 지금 무엇이 검증 가능한 상태인지 한 곳에서 판정한다 (SSOT).
  detect:
    runs-on: ubuntu-latest
    outputs:
      hasWorkspace: ${{ steps.probe.outputs.hasWorkspace }}
    steps:
      - uses: actions/checkout@v5
      - id: probe
        run: |
          if [ -f Cargo.toml ]; then
            echo "hasWorkspace=true" >> "$GITHUB_OUTPUT"
            echo "Rust 워크스페이스 있음. cargo 게이트가 돈다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hasWorkspace=false" >> "$GITHUB_OUTPUT"
            echo "**Cargo.toml 없음 (부트스트랩 단계). cargo 게이트는 건너뛴다. 이 표면은 검증되지 않았다.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 계약 게이트. 외부 프로세스 없이 도는 것만. PR 마다 전부 돈다.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 폴더 규약
        run: python -X utf8 tests/audit/noScriptsDir.py
      - name: 워크스페이스 위생
        run: python -X utf8 tests/audit/workspaceHygiene.py
      - name: silent failure 검출기 자체 검증
        run: python -X utf8 tests/audit/checkSilentFail.py --selftest
      - name: silent failure 금지
        run: python -X utf8 tests/audit/checkSilentFail.py
      # provider 이름이 드라이버 밖에 나타나면 그 자체가 설계 결함이다. 통과를 보기 전에 실패할 수
      # 있는지부터 확인한다.
      - name: provider 격리 검출기 자체 검증
        run: python -X utf8 tests/audit/providerIsolation.py --selftest
      - name: provider 이름은 드라이버 밖에 없다
        run: python -X utf8 tests/audit/providerIsolation.py
      # lint 표를 벗어난 crate 는 아무 경고도 없이 규칙 밖에 산다.
      - name: lint 표 검출기 자체 검증
        run: python -X utf8 tests/audit/workspaceLints.py --selftest
      - name: crate 는 워크스페이스 lint 표를 따른다
        run: python -X utf8 tests/audit/workspaceLints.py
      # 이 제품의 유일한 절대 규칙. 대화를 담을 수 있는 타입은 저장소 crate 에 나타나지 못한다.
      - name: 대화 사본 검출기 자체 검증
        run: python -X utf8 tests/audit/noTranscriptCopy.py --selftest
      - name: 대화 사본을 갖지 않는다
        run: python -X utf8 tests/audit/noTranscriptCopy.py
      # 낯선 사람의 clone 에 없는 것을 공개 파일이 가리키면 그건 그 사람이 처음 보는 404 다.
      - name: 공개 참조 검출기 자체 검증
        run: python -X utf8 tests/audit/publicReferences.py --selftest
      - name: 추적 파일은 추적되는 것만 가리킨다
        run: python -X utf8 tests/audit/publicReferences.py
      # 라이선스는 장식이 아니라 정책이다. 그것을 말하는 표면이 열 곳이 넘고 어느 것이 어긋나도
      # 빌드는 통과한다. AGPL 로 옮긴 첫 시간에 네 곳이 어긋났다.
      - name: 라이선스 정책 검출기 자체 검증
        run: python -X utf8 tests/audit/licenseSsot.py --selftest
      - name: 라이선스를 말하는 모든 표면이 같은 말을 한다
        run: python -X utf8 tests/audit/licenseSsot.py
      # 셸을 거쳐 들어온 텍스트는 이스케이프를 그것이 가리키는 바이트로 바꿔 놓는다. 컴파일러도 타입
      # 검사도 테스트도 보지 못하고, git 은 그 파일을 바이너리로 취급해 검색을 멈춘다.
      - name: 소스 제어문자 검출기 자체 검증
        run: python -X utf8 tests/audit/sourceTextIntegrity.py --selftest
      - name: 소스 파일은 읽을 수 있는 텍스트다
        run: python -X utf8 tests/audit/sourceTextIntegrity.py
      # 요청마다 누가 할 수 있는지 규칙이 있고 벽이 먼저 물어진다. 컴파일러는 crate 경계 너머로
      # 빠진 요청을 말해주지 못한다.
      - name: 스코프 벽 검출기 자체 검증
        run: python -X utf8 tests/audit/scopeWall.py --selftest
      - name: 모든 요청에 권한 규칙이 있다
        run: python -X utf8 tests/audit/scopeWall.py
      - name: Provider config write gate selftest
        run: python -X utf8 tests/audit/configReadOnly.py --selftest
      - name: Provider configuration stays read-only
        run: python -X utf8 tests/audit/configReadOnly.py
      # 저장소에 있으나 도는 러너가 없는 게이트를 잡는다. 이 단계와 preflight 의 GATES 표가
      # 서로를 검사하므로, 어느 한쪽에만 추가된 게이트는 red 가 된다.
      - name: 게이트 러너 커버리지 자체 검증
        run: python -X utf8 tests/audit/gateCoverage.py --selftest
      - name: 게이트 러너 커버리지
        run: python -X utf8 tests/audit/gateCoverage.py
      # 북극성 점수는 board.toml 에서 계산된다. 증거가 없는 숫자와, 네 언어 README 가
      # 서로 다른 점수판을 인쇄하는 상태를 여기서 막는다.
      - name: 북극성 점수판 자체 검증
        run: python -X utf8 tests/audit/northStar/board.py --selftest
      - name: 북극성 점수판
        run: python -X utf8 tests/audit/northStar/board.py
      - name: README 점수판 대조 자체 검증
        run: python -X utf8 tests/audit/northStar/readmeParity.py --selftest
      - name: README 점수판 대조 (4 개 언어)
        run: python -X utf8 tests/audit/northStar/readmeParity.py
      # `--check-push` 는 git pre-push 의 stdin 프로토콜을 읽으므로 CI 에서는 쓸 수 없다
      # (입력이 없으면 아무것도 검사하지 않고 조용히 통과한다). CI 는 범위를 명시한다.
      # PR 은 base..head, push 는 before..sha. 새 브랜치의 before 는 0 이라 그때는 HEAD 만 본다.
      - name: AI 귀속 금지 (커밋 범위)
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "base 가 없다 (새 브랜치). HEAD 커밋만 검사한다."
            base="$(git rev-parse "${head}^" 2>/dev/null || echo "$head")"
          fi
          echo "범위: $base..$head"
          python -X utf8 tests/audit/checkNoAiMarkers.py --check-range "$base" "$head"

  # Rust 계약. `Cargo.toml` 이 생기는 순간부터 실질적으로 돈다.
  rust:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 부트스트랩 알림
        if: needs.detect.outputs.hasWorkspace != 'true'
        run: |
          echo "::notice title=cargo 게이트 SKIP::Cargo.toml 없음. fmt/clippy/test/shear 가 돌지 않았다."
          echo "**cargo 게이트 SKIP.** fmt, clippy, test, shear 가 돌지 않았다." >> "$GITHUB_STEP_SUMMARY"
      - name: 툴체인 (rust-toolchain.toml 이 판본을 고정한다)
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: needs.detect.outputs.hasWorkspace == 'true'
      - uses: actions/setup-node@v5
        if: needs.detect.outputs.hasWorkspace == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            extensions/runtrol-vscode/package-lock.json
            clients/typescript/package-lock.json
      - name: VS Code 확장 의존성
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: npm --prefix extensions/runtrol-vscode ci
      - name: Linux 네이티브 자격 증명 저장소
        if: needs.detect.outputs.hasWorkspace == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          keyring_environment="$(printf 'runtrol-ci' | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
          eval "$keyring_environment"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: 공개 TypeScript Runtime SDK 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeClientSdk.py --selftest
      - name: 공개 TypeScript Runtime SDK 생성, 계약, 외부 패키지 소비
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeClientSdk.py
      - name: 공개 Rust Runtime SDK 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeRustClientSdk.py --selftest
      - name: 공개 Rust Runtime SDK 패키징과 외부 소비
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeRustClientSdk.py
      - name: standalone Runtime 배포 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeDistribution.py --selftest
      - name: standalone Runtime 6개 대상, 내용 허용 목록, provenance 계약
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeDistribution.py
      - name: 공개 Runtime 문서 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeDocumentation.py --selftest
      - name: 공개 Runtime 프로토콜, 연동, 보안, 운영 문서 대조
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/runtimeDocumentation.py
      - name: Mission thin boundary 검출기 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/orchestrationThinBoundary.py --selftest
      - name: Mission 계층은 내용 비저장, provider 중립
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/orchestrationThinBoundary.py
      - name: Mission 증거 경계 검출기 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/evidenceBoundary.py --selftest
      - name: Mission 증거는 식별자와 digest만 저장
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/evidenceBoundary.py
      - name: Mission 및 Capability 계약 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/missionGrowthContracts.py --selftest
      - name: Mission 실행, 복구, 로컬 승인, 명시적 Capability 재사용
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/missionGrowthContracts.py
      - name: VS Code 확장 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodeExtension.py --selftest
      - name: VS Code 확장
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodeExtension.py
      - name: VS Code 플랫폼 패키지 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodePackage.py --selftest
      - name: VS Code 릴리스 버전, 대상, 내용 allowlist 계약
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodePackage.py
      - name: 동일한 크로스 플랫폼 첫 실행 계약 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/crossPlatformContract.py --selftest
      - name: 6개 네이티브 대상의 동일한 첫 실행 계약
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/crossPlatformContract.py
      - name: 출하 VSIX 첫 실행 여정 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/crossPlatformMatrix.py --selftest
      - name: 릴리스 버전 정본 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/versionSsot.py --selftest
      - name: Runtime과 Studio 릴리스 버전 정본
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/versionSsot.py
      - name: 확증된 provider 갱신 채널 계약
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo test -p runtrol-audit --test channelVerdict
      - name: provider 갱신 실패와 정확한 롤백 리허설
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo test -p runtrol-audit --test cliUpdateRehearsal
      - name: VS Code 이벤트 표현 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodeEventCoverage.py --selftest
      - name: provider 어휘의 모든 이벤트가 VS Code 표현을 갖는다
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/vscodeEventCoverage.py
      - name: cargo fmt
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      # 다른 플랫폼의 cfg 분기를 이 잡에서도 본다. Linux 호스트에서는 MSVC 도구의 `lib.exe`가
      # 없으므로 MinGW 도구와 GNU 대상을 사용한다. 로컬 preflight 는 현재 호스트의 반대 대상을 쓴다.
      - name: cargo clippy (다른 플랫폼 cfg 분기)
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --all-targets --workspace --target x86_64-pc-windows-gnu -- -D warnings
      - name: memory budget gate product binary
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo build -p runtrol --bin runtrol
      - name: cargo test
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo test --all
      - name: Core project identity and atomic worktree reservation
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: cargo test -p runtrol-audit --test sessionOverlapGuard
      - name: 자식 회수 게이트 자체 검증
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/orphanReaping.py --selftest
      - name: 부모 강제 종료 뒤 자식 회수
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: python -X utf8 tests/audit/orphanReaping.py
      # 의존성 부패 게이트. cargo-shear 를 고른 이유:
      # 셋 중 유일하게 `[workspace.dependencies]` 미사용 항목을 잡고 (버전 SSOT 가 거기 산다),
      # stable 에서 돌고, 컴파일하지 않는 AST 파싱이라 한 플랫폼에서 돌려도 cfg 분기까지 덮는다.
      # cargo-udeps 는 2026 년에도 nightly 전용 + 유지보수 모드, machete 는 정규식이라
      # use 중첩 4 단 한계가 있고 workspace 표를 못 본다.
      # 장기 답은 Cargo 자체 lint (`cargo::unused_dependencies`, `unused_workspace_dependencies`) 이지만
      # 2026-07 기준 nightly 전용이다 (rust-lang/cargo#12235). 안정화되면 이 단계를 지운다.
      - uses: cargo-bins/cargo-binstall@main
        if: needs.detect.outputs.hasWorkspace == 'true'
      # **`--force` 는 필수다 (실측).** 캐시가 cargo 의 설치 원장 (`.crates2.json`) 은 복원하면서
      # `~/.cargo/bin` 의 실제 바이너리는 복원하지 않는 상태가 실제로 나왔다. 그러면 binstall 이
      # 원장을 읽고 "already installed" 로 건너뛰고, 다음 줄이 `no such command: shear` 로 죽는다.
      # `--force` 는 원장을 믿지 않고 항상 설치하므로 이 계열이 통째로 사라진다 (몇 초 비용).
      - name: cargo shear (미사용 의존성)
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: |
          cargo binstall --no-confirm --force cargo-shear
          cargo shear
      # 공급망 + `deny.toml` 의 기각 원장. 원장을 문서로만 두면 다음 사람은 읽지 않는다.
      # advisory DB 를 git 으로 가져오므로 네트워크가 필요하다.
      - name: cargo deny (공급망·기각 원장)
        if: needs.detect.outputs.hasWorkspace == 'true'
        run: |
          cargo binstall --no-confirm --force cargo-deny
          cargo deny check

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install relay dependencies
        run: npm --prefix relay ci
      - name: Check relay types and Durable Object contracts
        run: npm --prefix relay run check
      - name: Build relay without deployment
        run: npm --prefix relay run build

  # 크로스 플랫폼. `어디서나 같은 방법` 축. Windows 잡은 WSL 없이 돈다.
  crossPlatform:
    needs: detect
    if: needs.detect.outputs.hasWorkspace == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - name: VS Code 확장 의존성
        run: npm --prefix extensions/runtrol-vscode ci
      - name: Linux 네이티브 자격 증명 저장소
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          keyring_environment="$(printf 'runtrol-ci' | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
          eval "$keyring_environment"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: macOS 네이티브 자격 증명 저장소
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/runtrol-ci.keychain-db"
          security create-keychain -p 'runtrol-ci' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p 'runtrol-ci' "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN_PASSWORD=runtrol-ci" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: extensions/runtrol-vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('extensions/runtrol-vscode/package-lock.json', 'extensions/runtrol-vscode/tooling/isolated-vscode.mjs') }}
      - name: memory budget gate product binary
        run: cargo build -p runtrol --bin runtrol
      - name: 출하 VSIX 설치, 번들 Core, 새 대화 작성 탭, 닫기
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/crossPlatformMatrix.py
      - name: VS Code Extension Host 성능 게이트 자체 검증
        run: python -X utf8 tests/audit/vscodeHostPerformance.py --selftest
      - name: 실제 VS Code 활성화, 뷰, 갱신 p95, RSS ratchet
        run: python -X utf8 tests/audit/vscodeHostPerformance.py
      - name: VS Code 확장 갱신과 롤백 게이트 자체 검증
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py --selftest
      - name: 활성 세션을 보존하는 VSIX 갱신과 롤백
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py
      - name: 출하된 Runtime 상호운용 게이트 자체 검증
        run: python -X utf8 tests/audit/shippedRuntimeInterop.py --selftest
      - name: 이 빌드의 클라이언트가 실제 출하된 Runtime 들과 hello 를 끝낸다
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 tests/audit/shippedRuntimeInterop.py
      - name: VS Code 이벤트 표현 게이트 자체 검증
        run: python -X utf8 tests/audit/vscodeEventCoverage.py --selftest
      - name: provider 어휘의 모든 이벤트가 VS Code 표현을 갖는다
        run: python -X utf8 tests/audit/vscodeEventCoverage.py
      - name: 실시간 메모리 계약 자체 검증
        run: python -X utf8 tests/audit/liveMemoryBudget.py --selftest
      - name: hot 세션과 구독자 4개 RSS 상한
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/liveMemoryBudget.py
      - name: 유휴 상주 비용 ratchet 자체 검증
        run: python -X utf8 tests/audit/idleFootprintRatchet.py --selftest
      - name: 유휴 데몬 RSS와 CPU ratchet
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/idleFootprintRatchet.py
      - name: cargo test
        if: matrix.os != 'macos-latest'
        run: cargo test --all
      - name: cargo test with short socket path
        if: matrix.os == 'macos-latest'
        env:
          TMPDIR: /tmp
        run: cargo test --all

      - name: 범용 ACP 게이트 자체 검증
        run: python -X utf8 tests/audit/genericAcpSmoke.py --selftest
      - name: 외부 TOML 공급자의 ACP 자식 프로세스 턴
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/genericAcpSmoke.py
      - name: 로컬 복원력 결함 주입 게이트 자체 검증
        run: python -X utf8 tests/audit/resilienceFaultInjection.py --selftest
      - name: 로컬 IPC 단절과 데몬 재시작 복원력
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/resilienceFaultInjection.py
      - name: 독립 ACP 구현 설치
        run: npm install --global --allow-scripts=opencode-ai opencode-ai@1.2.27
      # Every provider compiled into the build has to exist here, or the model-detection gate refuses a run it
      # cannot make complete. Adding a built-in manifest without adding its CLI is what made that gate red.
      - name: 두 번째 독립 ACP 구현 설치
        run: npm install --global --allow-scripts=cline cline@3.0.55
      - name: 독립 ACP 구현 게이트 자체 검증
        run: python -X utf8 tests/audit/externalAcpSmoke.py --selftest
      - name: 독립 설치 ACP 구현의 두 턴과 native load
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/externalAcpSmoke.py --require-external
      - name: 실물 Claude Code 고정 판본 설치
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.220
      - name: VS Code 실물 provider 전체 여정 게이트 자체 검증
        run: python -X utf8 tests/audit/vscodeRealProviderJourney.py --selftest
      - name: VS Code에서 실물 CLI 시작, 승인, 중단, 재접속, workspace 전환, 종료
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/vscodeRealProviderJourney.py --require-external
      - name: 실물 두 provider Mission 여정 게이트 자체 검증
        run: python -X utf8 tests/audit/missionLiveJourney.py --selftest
      - name: 실물 두 provider의 검토, 실행, Receipt, 통합, 보관 여정
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/missionLiveJourney.py --require-external
      - name: 병렬 결과 비교 게이트 자체 검증
        run: python -X utf8 tests/audit/fleetComparisonSmoke.py --selftest
      - name: 실물 두 provider의 병렬 worktree 실행, 비교, 선택 결과 통합
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/fleetComparisonSmoke.py --require-external
      - name: 실물 Codex 고정 판본 설치
        run: npm install --global @openai/codex@0.146.0
      - name: 고정 판본 credential-free 모델 fixture 준비
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-pinned-model-detection-codex
          RUNTROL_MODEL_GATE_OPERATOR_HOME: ${{ runner.temp }}/runtrol-pinned-model-detection-home
          RUNTROL_MODEL_GATE_EXPECTED: '{"claude":["runtrol-pinned-cache-sentinel"]}'
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --seed-fixtures
      - name: provider surface drift 게이트 자체 검증
        run: python -X utf8 tests/audit/agentSurfaceDrift.py --selftest
      - name: 실물 provider CLI 표면은 고정 판본과 호환
        run: python -X utf8 tests/audit/agentSurfaceDrift.py --require-all
      - name: 고정 판본 모델 인식 게이트 자체 검증
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-pinned-model-detection-codex
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --selftest
      - name: 고정 판본 provider는 credential 없이 모델을 인식
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-pinned-model-detection-codex
          RUNTROL_MODEL_GATE_OPERATOR_HOME: ${{ runner.temp }}/runtrol-pinned-model-detection-home
          RUNTROL_MODEL_GATE_EXPECTED: '{"claude":["runtrol-pinned-cache-sentinel"]}'
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --require-all
      - name: 실물 Claude hidden approval 게이트 자체 검증
        run: python -X utf8 tests/audit/claudeApprovalSmoke.py --selftest
      - name: 실물 Claude hidden approval 거부 왕복
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/claudeApprovalSmoke.py --require-external
      - name: 헤드리스 폰 실물 CLI 여정 게이트 자체 검증
        run: python -X utf8 tests/audit/phoneDrivesPcSmoke.py --selftest
      - name: 헤드리스 폰에서 실물 CLI 시작, 입력, 출력, 종료
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/phoneDrivesPcSmoke.py --require-external
      - name: 헤드리스 폰 승인 왕복 게이트 자체 검증
        run: python -X utf8 tests/audit/approvalRoundtripSmoke.py --selftest
      - name: 헤드리스 폰의 실물 CLI 승인 거부와 턴 재개
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/approvalRoundtripSmoke.py --require-external
      - name: 헤드리스 폰 원격 단절 복원력 게이트 자체 검증
        run: python -X utf8 tests/audit/remoteResilienceFaultInjection.py --selftest
      - name: 헤드리스 폰 네트워크 단절과 Core 재시작 복원
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/remoteResilienceFaultInjection.py --require-external
      - name: 제거 독립성 게이트 자체 검증
        run: python -X utf8 tests/audit/uninstallLeavesNoTrace.py --selftest
      - name: runtrol home 삭제 뒤 provider 세션 재개
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/uninstallLeavesNoTrace.py

  # Parser probes need no account or turn. The approval journey runs the current real CLI against a local
  # deterministic Messages endpoint, carries only a non-secret sentinel, and spends no hosted model token.
  providerDrift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      # Deliberately unpinned. This job exists to notice the day a vendor changes its surface, so every provider
      # compiled into the build has to be here at whatever version it ships today.
      - name: Install latest provider CLIs without credentials
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code --allow-scripts=opencode-ai --allow-scripts=cline @anthropic-ai/claude-code @openai/codex opencode-ai cline
      - name: Seed provider-owned model cache fixture
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-model-detection-codex
          RUNTROL_MODEL_GATE_OPERATOR_HOME: ${{ runner.temp }}/runtrol-model-detection-home
          RUNTROL_MODEL_GATE_EXPECTED: '{"claude":["runtrol-hosted-cache-sentinel"]}'
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --seed-fixtures
      - name: Provider surface drift gate selftest
        run: python -X utf8 tests/audit/agentSurfaceDrift.py --selftest
      - name: Built-in unauthenticated provider probes remain compatible
        run: python -X utf8 tests/audit/agentSurfaceDrift.py --require-all
      - name: Model discovery gate selftest
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-model-detection-codex
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --selftest
      - name: Every built-in provider discovers models without credentials
        env:
          CODEX_HOME: ${{ runner.temp }}/runtrol-model-detection-codex
          RUNTROL_MODEL_GATE_OPERATOR_HOME: ${{ runner.temp }}/runtrol-model-detection-home
          RUNTROL_MODEL_GATE_EXPECTED: '{"claude":["runtrol-hosted-cache-sentinel"]}'
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/modelDetectionSmoke.py --require-all
      - name: Real Claude hidden approval gate selftest
        run: python -X utf8 tests/audit/claudeApprovalSmoke.py --selftest
      - name: Current real Claude hidden approval denial round trip
        env:
          TMPDIR: ${{ matrix.os == 'macos-latest' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/claudeApprovalSmoke.py --require-external
