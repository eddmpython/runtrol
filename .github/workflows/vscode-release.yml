name: vscode-release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a tagged GitHub release after all native packages pass
        required: true
        type: boolean
        default: false

concurrency:
  group: vscode-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      targetCount: ${{ steps.manifest.outputs.targetCount }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the extension release SSOT
        id: manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = require('./extensions/runtrol-vscode/package.json');
          const targets = require('./extensions/runtrol-vscode/release-targets.json');
          const include = Object.entries(targets).map(([target, contract]) => ({ target, ...contract }));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${manifest.version}\ntargetCount=${include.length}\nmatrix=${JSON.stringify({ include })}\n`,
          );
          NODE

  package:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux native build and VS Code test dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - name: Install deterministic frontend dependencies
        run: npm --prefix extensions/runtrol-vscode ci
      - name: Refuse a runner that differs from the release SSOT
        run: node -e "const actual=process.platform+'-'+process.arch; const expected='${{ matrix.target }}'; if(actual!==expected) throw new Error('runner is '+actual+', expected '+expected)"
      - name: Build the native release Core
        run: cargo build --release -p runtrol --bin runtrol --no-default-features --target-dir target/vscode-release
      - name: Package the native VSIX
        run: npm --prefix extensions/runtrol-vscode run package:native
        env:
          RUNTROL_CORE_BINARY: target/vscode-release/release/${{ matrix.executable }}
      - name: Inspect exact VSIX contents and Core bytes
        run: >-
          python -X utf8 tests/audit/vscodePackage.py
          --archive release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
          --target ${{ matrix.target }}
          --core target/vscode-release/release/${{ matrix.executable }}
      - name: Install and activate the package in clean VS Code
        if: matrix.family != 'linux'
        run: node extensions/runtrol-vscode/tooling/installed-package.mjs release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - name: Install and activate the package in clean VS Code on Linux
        if: matrix.family == 'linux'
        run: xvfb-run -a node extensions/runtrol-vscode/tooling/installed-package.mjs release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - name: VS Code upgrade and rollback gate selftest
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py --selftest
      - name: Upgrade and roll back with one active session
        env:
          TMPDIR: ${{ matrix.family == 'macos' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py --archive release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    needs: [prepare, package]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - run: npm --prefix extensions/runtrol-vscode ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtrol-studio-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true
      - name: Refuse an incomplete platform set
        run: |
          count="$(find release -maxdepth 1 -name 'runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix' -type f | wc -l)"
          test "$count" -eq "${{ needs.prepare.outputs.targetCount }}"
      - name: Create the tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create vscode-v${{ needs.prepare.outputs.version }}
          release/runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix
          --title "Runtrol Studio ${{ needs.prepare.outputs.version }}"
          --notes-file CHANGELOG.md
