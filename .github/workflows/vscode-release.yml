name: vscode-release

on:
  push:
    branches:
      - main
    paths:
      - extensions/runtrol-vscode/release-policy.json
  workflow_dispatch:
    inputs:
      release:
        description: Publish all native packages and create the tagged GitHub release
        required: true
        type: boolean
        default: false
      publishExisting:
        description: Publish the already tagged current release to Marketplace without rebuilding
        required: true
        type: boolean
        default: false

concurrency:
  group: vscode-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      targetCount: ${{ steps.manifest.outputs.targetCount }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify patch-only extension release sequence
        env:
          CREATE_RELEASE: ${{ github.event_name == 'push' || inputs.release }}
          PUBLISH_EXISTING: ${{ inputs.publishExisting }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import {
            extensionReleaseTag,
            previousExtensionReleaseTag,
          } from './extensions/runtrol-vscode/tooling/extension-manifest.mjs';

          const tagExists = (tag) => spawnSync(
            'git',
            ['show-ref', '--verify', '--quiet', `refs/tags/${tag}`],
            { stdio: 'ignore' },
          ).status === 0;

          const tagIsAncestorOfHead = (tag) => spawnSync(
            'git',
            ['merge-base', '--is-ancestor', tag, 'HEAD'],
            { stdio: 'ignore' },
          ).status === 0;

          if (process.env.CREATE_RELEASE === 'true' && process.env.PUBLISH_EXISTING === 'true') {
            throw new Error('release and publishExisting are mutually exclusive');
          }
          if (
            (process.env.CREATE_RELEASE === 'true' || process.env.PUBLISH_EXISTING === 'true')
            && process.env.RELEASE_REF !== 'refs/heads/main'
          ) {
            throw new Error('Marketplace publication runs only from main');
          }

          if (!tagExists(previousExtensionReleaseTag)) {
            throw new Error(`the exact previous extension release ${previousExtensionReleaseTag} is missing`);
          }
          if (process.env.PUBLISH_EXISTING === 'true') {
            if (!tagExists(extensionReleaseTag)) {
              throw new Error(`the extension release ${extensionReleaseTag} does not exist`);
            }
            if (!tagIsAncestorOfHead(extensionReleaseTag)) {
              throw new Error(`the extension release ${extensionReleaseTag} is not in the current main history`);
            }
          } else if (process.env.CREATE_RELEASE === 'true' && tagExists(extensionReleaseTag)) {
            throw new Error(`the extension release ${extensionReleaseTag} already exists`);
          }
          NODE
      - name: Read the extension release SSOT
        id: manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { packageManifest as manifest } from './extensions/runtrol-vscode/tooling/extension-manifest.mjs';
          const targets = JSON.parse(fs.readFileSync('./extensions/runtrol-vscode/release-targets.json', 'utf8'));
          const include = Object.entries(targets).map(([target, contract]) => ({ target, ...contract }));
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${manifest.version}\ntargetCount=${include.length}\nmatrix=${JSON.stringify({ include })}\n`,
          );
          NODE

  package:
    needs: prepare
    if: ${{ github.event_name == 'push' || ! inputs.publishExisting }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux native build and VS Code test dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring xvfb
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          keyring_environment="$(printf 'runtrol-ci' | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
          eval "$keyring_environment"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: macOS native credential store
        if: matrix.family == 'macos'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/runtrol-ci.keychain-db"
          security create-keychain -p 'runtrol-ci' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p 'runtrol-ci' "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN_PASSWORD=runtrol-ci" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - name: Install deterministic frontend dependencies
        run: npm --prefix extensions/runtrol-vscode ci
      - name: Refuse a runner that differs from the release SSOT
        run: node -e "const actual=process.platform+'-'+process.arch; const expected='${{ matrix.target }}'; if(actual!==expected) throw new Error('runner is '+actual+', expected '+expected)"
      - name: Build the native release Core
        run: cargo build --release -p runtrol --bin runtrol --target-dir target/vscode-release
      - name: Package the native VSIX
        run: npm --prefix extensions/runtrol-vscode run package:native
        env:
          RUNTROL_CORE_BINARY: target/vscode-release/release/${{ matrix.executable }}
      - name: Inspect exact VSIX contents and Core bytes
        run: >-
          python -X utf8 tests/audit/vscodePackage.py
          --archive release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
          --target ${{ matrix.target }}
          --core target/vscode-release/release/${{ matrix.executable }}
      - name: Install and activate the package in clean VS Code
        if: matrix.family != 'linux'
        run: node extensions/runtrol-vscode/tooling/installed-package.mjs release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - name: Install and activate the package in clean VS Code on Linux
        if: matrix.family == 'linux'
        run: xvfb-run -a node extensions/runtrol-vscode/tooling/installed-package.mjs release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - name: VS Code upgrade and rollback gate selftest
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py --selftest
      - name: Upgrade and roll back with one active session
        env:
          TMPDIR: ${{ matrix.family == 'macos' && '/tmp' || runner.temp }}
        run: python -X utf8 tests/audit/vscodeUpgradeRollback.py --archive release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: release/runtrol-studio-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: ${{ github.event_name == 'push' || inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - run: npm --prefix extensions/runtrol-vscode ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtrol-studio-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true
      - name: Refuse an incomplete platform set
        run: |
          count="$(find release -maxdepth 1 -name 'runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix' -type f | wc -l)"
          test "$count" -eq "${{ needs.prepare.outputs.targetCount }}"
      - name: Publish and verify all Marketplace platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          node extensions/runtrol-vscode/tooling/publish-marketplace.mjs
          --directory release

  marketplace:
    needs: [prepare, publish]
    if: ${{ github.event_name == 'push' || inputs.release }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux native VS Code dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring xvfb
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          keyring_environment="$(printf 'runtrol-ci' | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
          eval "$keyring_environment"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: macOS native credential store
        if: matrix.family == 'macos'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/runtrol-marketplace-ci.keychain-db"
          security create-keychain -p 'runtrol-ci' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p 'runtrol-ci' "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "RUNTROL_TEST_MACOS_KEYCHAIN_PASSWORD=runtrol-ci" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - name: Install deterministic frontend dependencies
        run: npm --prefix extensions/runtrol-vscode ci
      - name: Refuse a runner that differs from the release SSOT
        run: node -e "const actual=process.platform+'-'+process.arch; const expected='${{ matrix.target }}'; if(actual!==expected) throw new Error('runner is '+actual+', expected '+expected)"
      - name: Install and activate the public Marketplace release
        if: matrix.family != 'linux'
        run: node extensions/runtrol-vscode/tooling/installed-package.mjs --marketplace
      - name: Install and activate the public Marketplace release on Linux
        if: matrix.family == 'linux'
        run: xvfb-run -a node extensions/runtrol-vscode/tooling/installed-package.mjs --marketplace

  publishExisting:
    needs: prepare
    if: inputs.publishExisting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/runtrol-vscode/package-lock.json
      - run: npm --prefix extensions/runtrol-vscode ci
      - name: Download the exact tagged GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download vscode-v${{ needs.prepare.outputs.version }} \
            --pattern 'runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix' \
            --dir release
      - name: Refuse an incomplete platform set
        run: |
          count="$(find release -maxdepth 1 -name 'runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix' -type f | wc -l)"
          test "$count" -eq "${{ needs.prepare.outputs.targetCount }}"
      - name: Inspect every downloaded VSIX before publication
        run: |
          for archive in release/runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix; do
            target="${archive#release/runtrol-studio-${{ needs.prepare.outputs.version }}-}"
            target="${target%.vsix}"
            python -X utf8 tests/audit/vscodePackage.py --archive "$archive" --target "$target"
          done
      - name: Publish and verify the tagged Marketplace platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          node extensions/runtrol-vscode/tooling/publish-marketplace.mjs
          --directory release

  release:
    needs: [prepare, package, publish, marketplace]
    if: ${{ github.event_name == 'push' || inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtrol-studio-${{ needs.prepare.outputs.version }}-*
          path: release
          merge-multiple: true
      - name: Create the tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create vscode-v${{ needs.prepare.outputs.version }}
          release/runtrol-studio-${{ needs.prepare.outputs.version }}-*.vsix
          --title "Runtrol Studio ${{ needs.prepare.outputs.version }}"
          --notes-file CHANGELOG.md
