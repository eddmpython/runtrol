# The one executable. It picks a personality from argv and does nothing else.
#
# Why the binary is kept thin: it necessarily links everything, so it is itself the exception to the layering. Keeping
# that exception in one short file is what lets the dependency-direction gate be strict about all the rest. Keeping the
# daemon and the command surface as libraries is also what lets an integration test link them, which a binary cannot.
[package]
name = "runtrol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "runtrol"
path = "src/main.rs"

[dependencies]
runtrol-cli = { workspace = true }
runtrol-daemon = { workspace = true }
# What this process passes on to anything it starts. A process-wide setting, so it belongs to the program.
runtrol-childproc = { workspace = true }
# Which providers this build can drive. The daemon takes the table rather than finding it, so the one place that says
# what a build can do is the place a build is assembled.
runtrol-drivers = { workspace = true }
# Where the daemon listens. Binding belongs to whoever is being a daemon, which is this file and nothing else.
runtrol-ipc = { workspace = true }
# The command and daemon entry points are asynchronous. The runtime is built here because the daemon needs an explicit
# blocking-worker ceiling.
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[lints]
workspace = true
