# PC 앞의 로컬 GUI. 데몬에게 묻기만 하고 세션을 감독하지 않는다 (runtrol-cli 와 같은 계층).
[package]
name = "runtrol-gui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Cargo's profile does not choose Tauri's embedded asset protocol. Product-window builds opt into this feature
# explicitly so a release binary cannot silently point at the development server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
# Tauri 의 빌드 단계. tauri.conf.json 을 읽어 런타임이 기대하는 context 를 만든다.
tauri-build = { workspace = true }

[dependencies]
runtrol-provider = { workspace = true }
runtrol-ipc = { workspace = true }
# 데몬에 닿는 방법. 없으면 시작하는 것까지 이미 여기 있다 (재사용).
runtrol-cli = { workspace = true }

# 셸. tests/_attempts/desktopShell 실측으로 확정됐다 (mainPlan/desktopGui).
tauri = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }

[lints]
workspace = true
