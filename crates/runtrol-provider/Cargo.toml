# The vocabulary a driver author programs against: identifiers, paths, time, errors.
#
# Dependencies here are a promise, not a convenience: every one of them lands in the build of every
# third-party driver. No runtime, no database, no platform bindings.
[package]
name = "runtrol-provider"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Identifiers cross the wire and land in a manifest, so they carry their own encoding rather than
# leaving each consumer to invent one.
serde = { workspace = true, features = ["std", "derive"] }
# UUIDv7 for session and approval identifiers: 16 bytes that sort by mint time.
uuid = { workspace = true, features = ["std", "v7"] }
# UTF-8 paths. runtrol's own surfaces are UTF-8 throughout, and carrying a lossy copy beside the
# real bytes would give one path two spellings.
camino = { workspace = true }
# Shared buffers for event payloads. Cloning an event for a second subscriber must be a refcount bump,
# not a copy, or the daemon's memory grows with the number of watchers rather than with the work.
bytes = { workspace = true }
thiserror = { workspace = true }

# Payloads are relayed verbatim, so the crate that emits them needs the raw-value pass-through.
serde_json = { workspace = true, features = ["std", "raw_value"] }

[dev-dependencies]
# The manifest schema lives here and only means anything as TOML, so its own tests read TOML. A
# development dependency rather than a real one: parsing files is the loader's job, in the kernel, and a
# third-party driver author must not inherit a parser to use the vocabulary.
toml = { workspace = true, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
