# The scope wall, the presence witness, and workspace root approval.
#
# A leaf on purpose. This crate must not depend on the kernel, so that kernel internals cannot weaken
# the wall and so that a future remote transport can depend on the wall without depending on the
# kernel. `tests/audit/dependencyDirection.rs` enforces it.
[package]
name = "runtrol-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
# Device and workspace root identifiers. UUIDv7 so both sort by the time they were created, which is
# also the order an audit listing wants to read.
uuid = { workspace = true, features = ["std", "v7"] }
# Randomness for presence challenge phrases. Named directly rather than drawn from a UUID: measured
# on uuid 1.24, `now_v7` is monotonic within a millisecond, so its high random bits do not change and
# a phrase drawn from them repeats. This is the crate uuid itself calls.
getrandom = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Unix directory identities hash the kernel device, inode, and creation time into the existing bounded row.
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
] }

# Stable directory identity on Windows requires one audited GetFileInformationByHandleEx boundary.
# The workspace forbids unsafe and cannot relax it after inheritance, so this crate repeats the
# table with deny and confines that call to the root identity platform module.
[lints.rust]
unsafe_code = "deny"
let_underscore_drop = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
self_named_module_files = "deny"
