# The dialogue plane's mechanical core: bounded identifiers, envelopes, receipts, ceilings, and accounting
# between Runtrol-managed sessions. No transport, no clock, no process, no provider name: the daemon wires
# this to its local named pipe and its managed process tree. A leaf on purpose, so the command surface and the
# daemon can both speak the same envelope without either reaching the other.
[package]
name = "runtrol-courier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }
# The hello and its answer cross a connection as JSON; the identifiers travel as their canonical text.
serde = { workspace = true, features = ["std", "derive"] }
# Message, call, session and room identifiers are UUIDv7 so each sorts by the moment it was minted.
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
# The wire tests read a hello and its answer back from JSON. The daemon that serves the wire owns the real
# serialization; this crate carries only the shapes, so serde_json is a test dependency here.
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
