# 감독자 커널. 세션 수명·계층·이벤트 순서·fan-out·manifest 로더·kind 레지스트리 seam.
[package]
name = "runtrol-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
test-support = []

[dependencies]
runtrol-provider = { workspace = true }
runtrol-security = { workspace = true }
runtrol-childproc = { workspace = true }
runtrol-store = { workspace = true }

thiserror = { workspace = true }
# `sync` only. The fan-out needs bounded channels and nothing else: no reactor, no timer, no OS thread.
# "macros" carries tokio::join! for the probe, which asks its two independent questions concurrently.
# `rt` and `time` are for the terminal host: a task that watches the hosted CLI's exit on a clock, and
# the settle before its terminal is released.
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
# Terminal output travels to every attached viewer by reference, like events do.
bytes = { workspace = true }
# The hosted CLI's screen, kept so a viewer that attaches late gets the current picture and so a click on a
# row can be turned into the keys that reach that row.
vt100 = { workspace = true }
# Provider manifests. Reading only: runtrol never writes one, so the writer half is left out.
toml = { workspace = true, features = ["std", "parse", "serde"] }
# The probe cache. JSON rather than the database, because a cache that cannot be read is simply absent and
# does not deserve a schema migration or an exclusive lock.
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# One test implements the driver contract from a script, which needs the macro that makes that contract `dyn`-able.
async-trait = { workspace = true }
# The daemon awaits a subscription and a probe runs a child process, so those two paths are tested with a
# runtime. Everything with a bound on it is proved synchronously, which is why this is the only place one is
# needed.
tokio = { workspace = true, features = ["rt", "macros"] }
# The probe's own tests read a manifest, which only means anything as TOML.
toml = { workspace = true, features = ["std", "parse", "serde"] }

[lints]
workspace = true
