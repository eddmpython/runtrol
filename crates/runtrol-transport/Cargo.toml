# Phone-facing transports. Security admission wraps a connection before any route sees a request.
[package]
name = "runtrol-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-security = { workspace = true }

bytes = { workspace = true }
thiserror = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
fastwebsockets = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
snow = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
base64ct = { workspace = true }
p256 = { workspace = true }
aes-gcm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
