# The frame format runtrol speaks to itself, and both ends of the local connection.
[package]
name = "runtrol-ipc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }

# Shared buffers. A payload read off the wire is a slice of what arrived, not a copy of it: every event a watcher sees
# crosses this crate, and copying each one would put a copy of every message on the path the design keeps copy free.
bytes = { workspace = true }
thiserror = { workspace = true }
# The request and response vocabulary. JSON because both ends of this connection are runtrol's own processes and a
# readable wire is worth more here than a compact one: an operator debugging why their command did nothing can look.
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
# The local connection. `net` is the named pipe and the socket file; `io-util` is the buffered read. Nothing here wants
# a network stack, and neither mechanism brings one.
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
# Both ends of the connection run in one test, so one of them is a task.
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
