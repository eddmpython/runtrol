# The frame format runtrol speaks to itself, and both ends of the local connection.
[package]
name = "runtrol-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }

# Shared buffers. A payload read off the wire is a slice of what arrived, not a copy of it: every event a watcher sees
# crosses this crate, and copying each one would put a copy of every message on the path the design keeps copy free.
bytes = { workspace = true }
# Terminal bytes ride the JSON wire as base64: the private wire is text, and the hosted CLI's output is
# arbitrary bytes that must arrive exactly as written.
base64ct = { workspace = true }
thiserror = { workspace = true }
# The request and response vocabulary. JSON because both ends of this connection are runtrol's own processes and a
# readable wire is worth more here than a compact one: an operator debugging why their command did nothing can look.
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
# The local connection. `net` is the named pipe and the socket file; `io-util` is the buffered read; `time` is the wait
# while a pipe instance is being replaced, which is the one condition here that is answered by asking again. Nothing
# here wants a network stack, and neither mechanism brings one.
tokio = { workspace = true, features = ["macros", "net", "io-util", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Linux exposes the peer PID through Tokio's safe SO_PEERCRED wrapper. Apple additionally needs proc_pidinfo to
# freeze that PID's kernel start instant while the authenticated socket is still live.
libc = { workspace = true }

[dev-dependencies]
# Both ends of the connection run in one test, so one of them is a task.
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }

# The owner-only Windows pipe needs one audited CreateNamedPipeW boundary because Tokio's safe builder does not
# accept a SECURITY_ATTRIBUTES DACL. The workspace forbids unsafe and cannot be relaxed by inheritance, so this crate
# repeats the table with deny and confines the calls to the Windows platform module.
[lints.rust]
unsafe_code = "deny"
let_underscore_drop = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
self_named_module_files = "deny"
