# Child process lifetime: what to run, what may be passed to it, and how it dies.
#
# This is where `unsafe` will be allowed once containment lands, which is the reason it is a crate rather
# than a module: the workspace sets `unsafe_code = "forbid"`, and `forbid` cannot be relaxed from inside.
# The override arrives with the code that needs it, not before.
[package]
name = "runtrol-childproc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
# Program lookup the way a shell does it. Not hand written: PATHEXT ordering, quoted PATH entries, and the
# executable bit on Unix are each easy to get subtly wrong, and getting them wrong means running the wrong
# program.
# `real-sys` is what supplies the actual filesystem lookup; without it the crate compiles to a
# test-double-only surface and `which` itself does not exist.
which = { workspace = true, features = ["real-sys"] }
thiserror = { workspace = true }
# Asking a CLI a question needs a child process and a deadline. `time` is what makes a hung CLI a reported
# timeout instead of a hang in whatever asked.
tokio = { workspace = true, features = ["process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

# Job objects, and the handles this process passes on. The kill-on-close job is what makes "runtrol dies, its
# children die" a kernel guarantee rather than a best effort; the console handles are what a started daemon
# must not be given a copy of.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Two system calls between fork and exec. `libc` rather than a safe wrapper: the code inside `pre_exec` is
# restricted to async-signal-safe calls, and a direct system call is exactly that, while a wrapper's
# allocation or locking would not be.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# **Not `[lints] workspace = true`.** This crate is the one place `unsafe` is allowed, and the workspace
# table sets `unsafe_code = "forbid"`, which cannot be relaxed from inside the crate that inherits it
# (measured: cargo hard-errors on mixing inheritance with an override). So the table is written out here with
# `deny` instead of `forbid`, and every `unsafe` block carries a safety argument. Which crates do this is
# pinned by `tests/audit/workspaceLints.rs`.
[lints.rust]
unsafe_code = "deny"
let_underscore_drop = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
self_named_module_files = "deny"
# **Deliberately absent: `print_stderr`.** `Drop` has no error channel, and a failed containment teardown is
# something an operator debugging a stray agent has to be able to see. Panicking there would replace one
# problem with a worse one, and swallowing it would hide the only evidence.
