# Compiled into the binary, so a fresh install has this provider with no file anywhere. An operator who needs
# something different writes a file with the same id and it replaces this one entirely.
#
# This provider needs no driver of its own. Measured on grok 1.0.4 (build d846eb93d9) by handshaking the real
# binary: `grok agent stdio` answers `initialize` with protocol version 1, `loadSession: true`, and
# `sessionCapabilities` of `list`, `resume` and `close`. Stored conversations therefore arrive through the
# official protocol path the generic driver already speaks, titles included, with nothing here restating what
# they are. It joins by declaring how to reach it, never by adding a branch to the core.
schema = 1
id = "grok"
display_name = "Grok"
kind = "acp"
# Names the service's own brand icon, kept in assets/brand/provider-icons and generated into the resources at
# build time. It identifies the service in the list.
icon = "grok"

[bin]
# Bare names, tried in this order. Measured on this machine: the installer places a native executable at
# ~/.grok/bin/grok.exe and puts that directory on the search path itself, with no launcher script in front.
names = ["grok", "grok.exe"]

[probe]
# Measured: `grok --version` prints `grok 1.0.4 (d846eb93d9) [stable]`, which semver-anywhere reads.
version = { args = ["--version"], parse = "semver-anywhere" }
# No flag block. The generic protocol driver passes no optional flags, so there is nothing to ask a parser about
# and no reason to teach this CLI a way to refuse work.

[transport]
argv = ["agent", "stdio"]
listen = "stdio"

# No `[models]` block, and no `list` command either. This CLI's `grok models` prints prose for a person, with no
# machine-readable flag, so naming it here would make a driver parse sentences. Its real catalogue lives in a
# version-keyed cache file the CLI maintains for itself, and reading a provider's private file is what this
# product refuses. Until the vendor ships a machine-readable listing, model choice stays with the CLI's own
# settings, which is also where it is most correct.

[secrets]
# Where this CLI keeps its own login. Not discoverable: a CLI does not report this, and guessing from its name is
# how a wall comes to protect a directory nobody uses. Measured on this machine: `~/.grok/auth.json` holds the
# OAuth credential and refresh token. runtrol never holds a provider credential, and the scope wall refuses any
# workspace that would let an agent read one either.
under_home = [".grok"]

# No `[update]` section. Measured: this CLI updates itself (`grok update`, installer declared as internal in its
# own configuration), so no package manager runtrol knows how to verify is the authority for it.

[help]
# This CLI's own commands for getting itself working. runtrol never runs them: it types one into the operator's
# own terminal and stops there.
#
# Measured against the installed CLI: `grok login` signs in through the vendor's own browser flow with a
# device-code path for headless machines, and `grok doctor` names installation, terminal and configuration health
# as what it diagnoses. No install line, because the vendor's installer is its own program and no package manager
# line runtrol could verify installs it.
sign_in = ["login"]
# `grok logout` exists and names itself "Sign out and clear cached credentials" (measured 2026-08-29,
# `grok --help` on the installed CLI).
sign_out = ["logout"]
diagnose = ["doctor"]

# No mid-session reasoning-effort surface, measured (2026-08-20, grok 1.0.x over ACP stdio):
# `session/new` announces per-model efforts inside `_meta.reasoningEfforts` (vendor extension), but
# `session/set_reasoning_effort` answers method-not-found, `session/set_model` silently ignores an
# extra reasoningEffort field, and `session/set_config_option` exists structurally while the session
# announces no config options and its value schema is private. So the announced efforts are not
# lifted into an event: offering a switch nothing can perform would be a lie in a picker.

[tui]
# This CLI's own terminal interface ("Grok Build TUI"), measured 1.0.5 on a real ConPTY (2026-08-25): bare
# `grok` opens a new conversation, `grok --resume <session id or title>` reopens one (`-c` continues the
# last). It enables the alternate screen and no mouse reporting; the surface's common translation covers it.
resume = ["--resume"]

[tui.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[store]
# Its conversations are enumerated over the ACP protocol (`session/list`), the surface the driver already
# speaks; the CLI keeps its own state under its home directory.
location = [".grok"]
format = "protocol"
# Deleting is not on that protocol, but this CLI publishes its own command for it: `grok sessions delete <ID>`
# (measured 2026-08-26 from `grok sessions delete --help`, which names one positional session id). Until this
# was read, the row offered no delete at all and the product said this service could not delete, which was
# our omission rather than the service's.
delete = ["sessions", "delete"]

[store.live]
# How this CLI says, without being asked, which conversations a process has open right now. Measured
# 2026-08-30 on 1.0.13: resuming one conversation left `events.jsonl` inside that conversation's own
# directory held by the running process, and the operating system named that process. Every other file in
# the same directory was held by nobody, so this one is the signal.
#
# Its own `active_sessions.json` looks like the right answer and is not: the structure for it is in the
# binary and the file stays `[]` through every session (measured the same day, twice).
root = [".grok/sessions"]
# The conversation directories sit under one directory per working folder, whose name is that folder
# percent-escaped (`C%3A%5CUsers%5C...`).
grouped_by_workspace = true
held = "events.jsonl"

[account]
# No status command is published: this CLI answers about the account over its own protocol extensions, which
# the blocks below name. Measured 2026-08-26 on 1.0.5 by handshaking the real binary over `agent stdio`, with
# no session opened and no turn taken. The extension methods carry a leading underscore on the wire, which is
# how this protocol marks a vendor extension, and both answer in well under a second.
protocol = "acp"

[account.identity]
# `_x.ai/auth/check_subscription` -> {"authenticated": true, "meta": {"auth_mode": "Oidc",
#   "subscription_tier": "SuperGrok", "email": "...", "team_id": "...", "is_zdr": false}}
#
# Only three of those are read. The address and the team are the operator's own details and answer no question
# the sidebar asks, so no pointer names them and nothing carries them out of the child process.
method = "_x.ai/auth/check_subscription"
signed_in = "/authenticated"
plan = "/meta/subscription_tier"
via = "/meta/auth_mode"

# `_x.ai/billing` -> {"config": {"currentPeriod": {"type": "USAGE_PERIOD_TYPE_WEEKLY", ...},
#   "billingPeriodStart": "2026-08-23T22:02:11.135977+00:00",
#   "billingPeriodEnd":   "2026-08-30T22:02:11.135977+00:00",
#   "onDemandCap": {"val": 0}, "onDemandUsed": {"val": 0}, "prepaidBalance": {"val": 0},
#   "isUnifiedBillingUser": true}, "subscription_tier": "SuperGrok"}
#
# One window, which is the plan's own usage period. Its length is not declared: the two instants say it, so
# an account billed monthly reads as a month from this same declaration.
#
# `creditUsagePercent` is the percentage this CLI states for a plan that meters credits, and it is simply
# absent on one that does not (measured: a SuperGrok account returns neither it nor `monthlyLimit`). The
# window then draws its reset with no bar, because a bar computed from a cap of zero would read as full.
[[account.window]]
method = "_x.ai/billing"
id = "billing_period"
used_percent = "/config/creditUsagePercent"
starts_at = "/config/billingPeriodStart"
resets_at = "/config/billingPeriodEnd"

# Why this account shows a period and no percentage, in this CLI's own terms.
#
# Measured 2026-08-27: this operator's account answers `check_subscription` with a `team_id`, and its
# billing answer then carries no `creditUsagePercent`, no `monthlyLimit` and no `used` at all. This CLI's
# own usage screen draws exactly two things from the two methods declared above, and for an account shaped
# like this it prints "Usage limits are managed by your team." rather than a bar. So there is no number
# being withheld here: the meter belongs to the team, and the row says that instead of standing empty and
# reading like something failed.
#
# An account with its own meter is unaffected: this only speaks when no window came back with a percentage.
[account.unmetered]
method = "_x.ai/auth/check_subscription"
when = "/meta/team_id"
say = "team-managed"

[events]
source = "acp"
