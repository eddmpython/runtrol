# Compiled into the binary, so a fresh install has this provider with no file anywhere. An operator who needs
# something different writes a file with the same id and it replaces this one entirely.
#
# Everything here is a fact about how to REACH the CLI. Nothing here says what it can do: its models come from
# its own `model/list`, its account from its own `account/read`, its protocol from the schema it generates. A
# key that restated one of those would be stale the first time the vendor shipped a release.
schema = 1
id = "codex"
display_name = "Codex"
# The editor files this service under its vendor's mark rather than the product's, which is also how the
# editor's own chat surface resolves it.
icon = "openai"
kind = "codex-app-server"

[bin]
# Bare names, tried in this order. Measured on this machine: a package manager installs a launcher script in
# front of the real program, and resolution unwraps it. The order is a preference and not a requirement.
names = ["codex", "codex.cmd", "codex.exe"]

[probe]
version = { args = ["--version"], parse = "semver-anywhere" }
# How to ask this CLI about a flag without letting it start work. The subcommand that generates its protocol
# schema reads nothing and starts no conversation, so a flag question costs no turn and no tokens.
flags = { safe_with = ["app-server", "generate-json-schema"] }

[modes]
# From this CLI's own generated schema (2026-08-19): TurnStartParams.approvalPolicy takes the AskForApproval
# vocabulary "untrusted", "on-request", "never". Deliberately absent: "never", the value that removes every
# approval question. That is switched at this CLI's own surface by someone at the machine, never through
# runtrol.
switchable = ["untrusted", "on-request"]

[transport]
# The daemon. Measured: it multiplexes every conversation over one pair of standard streams, which is what
# makes N sessions cost one child.
argv = ["app-server", "--stdio"]
listen = "stdio"

# No `[models]` block. Measured: this CLI enumerates its own models in 16 milliseconds and reports a display
# name, a description and the reasoning efforts each one accepts. Writing any of that here would be a copy that
# goes stale on the vendor's next release, and the discovery ladder exists precisely so it does not have to.

[secrets]
# Where this CLI keeps its own login. Not discoverable: a CLI does not report this, and guessing from its name
# is how a wall comes to protect a directory nobody uses. runtrol never holds a provider credential, and the
# scope wall refuses any workspace that would let an agent read one either.
#
# Measured, and this one is load bearing: the daemon asks its client to refresh an authentication token. The
# driver answers that it will not, every time, and tells the operator.
under_home = [".codex"]

[update]
# The built-in adapter may use npm only after the resolved entry point and package metadata independently agree.
hint = "npm"

[help]
# This CLI's own commands for getting itself working. runtrol never runs them: it types one into the operator's
# own terminal and stops there.
#
# Not discoverable, for the same reason as the sibling manifests. Measured against the installed CLI:
# `codex login`, `codex login status` and `codex doctor` exist, and the doctor names installation, config, auth
# and runtime health as what it diagnoses.
sign_in = ["login"]
# `codex logout` exists and names itself "Remove stored authentication credentials" (measured 2026-08-29,
# `codex --help` on the installed CLI).
sign_out = ["logout"]
diagnose = ["doctor"]
install = "npm install --global @openai/codex"

# No slash-command surface, measured (2026-08-20, `codex app-server generate-json-schema` on the
# installed CLI): neither ClientRequest (94 methods) nor ServerNotification (72 methods) carries a
# command catalogue announcement. The only "slash" in the schema is /tmp path handling, and
# `skills/list` is a different concept (skill packages, not composer commands). So this provider's
# composer offers no slash menu, and that absence is the CLI's, not a gap here.

[tui]
# This CLI's own terminal interface, measured 0.149.1 on a real ConPTY (2026-08-25): bare `codex` opens a new
# conversation and draws its welcome at once, `codex resume <thread id>` reopens one. It enables no mouse
# reporting of its own; the surface's common translation covers it.
resume = ["resume"]

[tui.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[store]
# Where the CLI keeps its threads: `~/.codex/sessions/<year>/<month>/<day>/rollout-*.jsonl` beside a
# `session_index.jsonl` (measured 0.149.1). Listing and deletion go through the app-server protocol
# (`thread/list`, `thread/delete`), which the driver already speaks.
location = [".codex/sessions"]
format = "rollout-jsonl"

[account]
# `account/read`, `account/rateLimits/read` and `account/usage/read` on the app-server protocol.
protocol = "app-server"

[events]
source = "app-server"
