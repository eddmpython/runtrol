# Compiled into the binary, so a fresh install has this provider with no file anywhere. An operator who needs
# something different writes a file with the same id and it replaces this one entirely.
#
# Everything here is a fact about how to REACH the CLI. Nothing here says what it can do: its capabilities come
# from its own startup frame, its models from its own store, its flags from its own argument parser. A key that
# restated one of those would be stale the first time the vendor shipped a release.
schema = 1
id = "claude"
display_name = "Claude Code"
# The editor's own icon font carries this service's mark. Named rather than shipped: the artwork stays the
# vendor's and this repository distributes none of it.
icon = "claude"
kind = "claude-stream-json"

[bin]
# Bare names, tried in this order. Measured on this machine: a package manager installs a launcher script in front
# of the real program, and resolution unwraps it. The order is a preference and not a requirement.
names = ["claude", "claude.cmd", "claude.exe"]

[probe]
version = { args = ["--version"], parse = "semver-anywhere" }
# How to ask this CLI about a flag without letting it start work. Measured: with the print flag and no input, every
# argument combination fails at parsing, which is exactly the state a flag question needs. Without this there is no
# safe way to ask, and asking unsafely can cost the operator a turn they did not request.
flags = { safe_with = ["-p"] }

[transport]
# The structured mode. Measured: without the verbose flag it refuses to stream structured output at all.
argv = [
    "--print",
    "--input-format",
    "stream-json",
    "--output-format",
    "stream-json",
    "--verbose",
]
listen = "stdio"

[modes]
# Measured 2026-08-19 on the installed CLI: the control channel's own refusal names the full vocabulary
# ("must be one of acceptEdits, auto, bypassPermissions, default, dontAsk, plan"). A refusal sentence is not
# a discovery surface, so the switchable set lives here beside the measurement. Deliberately absent:
# bypassPermissions, dontAsk, and auto, the modes that remove or thin the questions an operator would
# otherwise see. Those are switched at this CLI's own surface by someone at the machine, never through
# runtrol.
switchable = ["default", "plan", "acceptEdits"]

[models]
# Tokens, never model identifiers. Measured: this CLI cannot enumerate its models. Asking it for one it does not
# have answers with a bare error and no list, so there is nothing to discover and these four are what it accepts.
# A surface shows them as aliases rather than as a catalogue, because that is what they are.
aliases = ["opus", "sonnet", "haiku", "fable"]

[secrets]
# Where this CLI keeps its own login. Not discoverable: a CLI does not report this, and guessing from its name is
# how a wall comes to protect a directory nobody uses. runtrol never holds a provider credential, and the scope
# wall refuses any workspace that would let an agent read one either.
under_home = [".claude"]

[update]
# The built-in adapter may use npm only after the resolved entry point and package metadata independently agree.
hint = "npm"

[help]
# This CLI's own commands for getting itself working. runtrol never runs them: it types one into the operator's
# own terminal and stops there.
#
# Not discoverable. The install line is needed exactly when no executable exists to ask, and the other two are
# named only in help text, which a driver may not read to approximate a capability. Measured against the
# installed CLI: `claude auth login`, `claude auth status`, `claude doctor` all exist and answer.
sign_in = ["auth", "login"]
diagnose = ["doctor"]
install = "npm install --global @anthropic-ai/claude-code"

[tui]
# This CLI's own terminal interface, measured 2.1.243 on a real ConPTY (2026-08-25): bare `claude` opens a new
# conversation, `claude --resume <session id>` reopens one. It queries the terminal at start (XTVERSION,
# DECRQM 2026) and waits for answers, so the surface hosting it answers like xterm. It enables its own mouse
# reporting; the surface's common translation covers it, so that reporting is switched off here.
resume = ["--resume"]
mouse = true
# Markers this CLI leaves in its own children. A daemon started from inside a Claude Code session inherits
# them, and the hosted TUI read them as "you are a child session" (measured 2026-08-25: transcript saving
# switched itself off). Removed so the hosted conversation is a first-class one.
env_unset = ["CLAUDE_CODE_*", "CLAUDE_*", "CLAUDECODE"]

[tui.env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
CLAUDE_CODE_DISABLE_MOUSE = "1"
CLAUDE_CODE_ALT_SCREEN_FULL_REPAINT = "1"
CLAUDE_CODE_SCROLL_SPEED = "3"

[store]
# Where the CLI resumes from: `<config>/projects/<folder slug>/<session id>.jsonl`, one file per conversation
# (measured 2.1.238). No listing or deletion command is published; the driver reads names off the store's doors.
location = [".claude/projects"]
format = "jsonl-per-session"

[account]
# `claude auth status --json`, measured 2.1.242: `loggedIn`, `authMethod`, `subscriptionType`. It answers who
# is signed in and nothing about limits.
status = ["auth", "status", "--json"]
# The limits themselves, measured 2.1.246. This CLI answers a `get_usage` control request on its own headless
# stream channel, with no turn, no prompt and no cost: the driver writes one request line, closes the pipe and
# reads the answer. It returns the five-hour window, the whole-account week and every model-scoped week, which
# is the same set its own `/usage` screen draws.
#
# Every flag here exists to keep a background reading from touching the operator's own machine:
#
#   --print --input-format stream-json --output-format stream-json --verbose
#       Opens the machine channel rather than a terminal interface. `--verbose` is what makes it emit frames.
#   --strict-mcp-config --mcp-config {"mcpServers":{}}
#       Starts none of the operator's MCP servers. Measured: without it, asking for usage every few minutes
#       boots every server they have configured, including runtrol's own.
#   --disable-slash-commands
#       Skips plugin and skill resolution, which a question about limits has no use for.
#   --settings {"disableAllHooks":true}
#       Runs none of the operator's hooks. Measured: without it every reading fires their `SessionStart`
#       commands, and a usage strip must not run somebody's scripts on a timer.
#
# Rejected after measuring: `--bare` skips hooks and MCP by itself in 1.1 seconds instead of 6, but it also
# refuses to read the browser sign-in, and the answer then comes back with `rate_limits_available: false`.
# A fast answer that says the account has no limits is worse than a slow one that is true.
#
# The reading leaves nothing behind: a session with no message writes no transcript, so the conversation list
# does not grow an empty row every time the strip refreshes (measured 2026-08-26).
usage = [
  "--print",
  "--input-format",
  "stream-json",
  "--output-format",
  "stream-json",
  "--verbose",
  "--strict-mcp-config",
  "--mcp-config",
  "{\"mcpServers\":{}}",
  "--disable-slash-commands",
  "--settings",
  "{\"disableAllHooks\":true}",
]

[events]
# Turn boundaries come from the stream-json transport the driver already reads.
source = "stream-json"
