# Compiled into the binary, so a fresh install has this provider with no file anywhere. An operator who needs
# something different writes a file with the same id and it replaces this one entirely.
#
# This provider needs no driver of its own. It speaks the generic protocol the `acp` kind already serves, so the
# entire cost of supporting it is this file. That is the boundary the manifest exists to hold: a CLI joins by
# declaring how to reach it, never by adding a branch to the core.
schema = 1
id = "opencode"
display_name = "OpenCode"
# Named, not shipped. The editor's icon font has no mark for this service, so a terminal stands in for this coding
# CLI; no vendor artwork is distributed.
icon = "terminal"
kind = "acp"

[bin]
# Bare names, tried in this order. Measured on this machine: a package manager installs a launcher script in front
# of the real program, and resolution unwraps it. A separate native installer also exists, and whichever one the
# operator's search path finds is the one that runs.
names = ["opencode", "opencode.cmd", "opencode.exe"]

[probe]
version = { args = ["--version"], parse = "semver-anywhere" }
# No flag block. The generic protocol driver passes no optional flags, so there is nothing to ask a parser about
# and no reason to teach this CLI a way to refuse work.

[transport]
# Measured on version 1.2.27: this subcommand answers `initialize` with protocol version 1 and announces
# `loadSession`, `sessionCapabilities.list`, `sessionCapabilities.resume` and `sessionCapabilities.fork`. Existing
# conversations therefore arrive through the official protocol, with nothing here restating what they are.
argv = ["acp"]
listen = "stdio"

# No `[models]` block. This CLI enumerates its own models, so writing any of them here would be a copy that goes
# stale on the vendor's next release.

[secrets]
# Where this CLI keeps its own login. Not discoverable: a CLI does not report this, and guessing from its name is
# how a wall comes to protect a directory nobody uses. Measured on this machine: configuration lives in the first
# and the session database with its credentials lives in the second. runtrol never holds a provider credential,
# and the scope wall refuses any workspace that would let an agent read one either.
under_home = [".config/opencode", ".local/share/opencode"]

[update]
# The built-in adapter may use npm only after the resolved entry point and package metadata independently agree.
hint = "npm"

[help]
# This CLI's own commands for getting itself working. runtrol never runs them: it types one into the operator's
# own terminal and stops there.
#
# Measured against the installed CLI: `opencode auth` manages providers and credentials. No diagnose entry,
# because this CLI's `debug` is a group of inspection subcommands rather than a single self-check, and offering
# one that only prints resolved configuration would send a stuck person somewhere that cannot help them.
sign_in = ["auth"]
install = "npm install --global --allow-scripts=opencode-ai opencode-ai"

[models]
# This CLI has its own model enumeration command even though the protocol its driver speaks has none.
# Measured on version 1.2.27: `opencode models` prints the current catalogue, one identifier per line, and
# exits 0 immediately. Naming the command is declaring how to reach the CLI; the list itself still comes from
# the CLI at the moment of asking, so it cannot go stale the way a written catalogue would.
list = ["models"]
