# 내장 kind 드라이버와 임베드 manifest. crates/ 안에서 provider 고유명사가 허용되는 유일한 곳.
[package]
name = "runtrol-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
runtrol-childproc = { workspace = true }

# Shared line buffers. A payload relayed to three watchers must cost three pointers, which means the line it
# came from has to be shareable rather than copied.
bytes = { workspace = true }
thiserror = { workspace = true }
# Protocol envelopes. `raw_value` is what lets a payload stay a slice of the line it arrived on instead of being
# rebuilt into a tree runtrol would then have to re-encode.
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
# Reading a child's output. `io-util` is the buffered reader; the process itself is started by the crate that
# owns child processes. `rt` is for one background task: the CLI whose sessions share a daemon needs a reader
# that sorts frames for every session at once, and there is nobody else to run it (a session cannot, because
# it would then only read while somebody was asking it for events).
tokio = { workspace = true, features = ["io-util", "sync", "process", "time", "rt"] }
# The behavioural contract has async methods and is held as `dyn`.
async-trait = { workspace = true }
sha2 = { workspace = true }

# The built-in manifests are compiled in as text and read by the same parser an operator file goes through, so the
# tests that hold them to the schema need it here too.
[dev-dependencies]
toml = { workspace = true, features = ["std", "parse", "serde"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync"] }

[lints]
workspace = true
