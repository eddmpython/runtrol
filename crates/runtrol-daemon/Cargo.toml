# The daemon: the composition root, the local listener, and request dispatch.
[package]
name = "runtrol-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
runtrol-security = { workspace = true }
runtrol-childproc = { workspace = true }
runtrol-store = { workspace = true }
runtrol-ipc = { workspace = true }
runtrol-core = { workspace = true }
runtrol-drivers = { workspace = true }
runtrol-transport = { workspace = true }
runtrol-vault = { workspace = true }
runtrol-update = { workspace = true }
runtrol-runtime-protocol = { workspace = true }

thiserror = { workspace = true }
bytes = { workspace = true }
# The requests and answers that cross the connection. The daemon reads and writes them; what they mean is the
# vocabulary crate's, and this only carries them.
serde_json = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
semver = { workspace = true }
getrandom = { workspace = true }
ed25519-dalek = { workspace = true }
base64ct = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# Serving is one task that owns the sessions and one task per connection, racing what they wait on against each
# other. That needs a runtime, channels, and a way to race: this is where the daemon owns them, which is what keeps
# the kernel free of any runtime decision at all.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
async-trait = { workspace = true }
runtrol-core = { workspace = true, features = ["test-support"] }
runtrol-runtime-client = { workspace = true, features = ["testing"] }
fastwebsockets = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Serving is checked end to end against a real endpoint, so its tests need the runtime started for them.
tokio = { workspace = true, features = ["io-util", "process", "rt", "macros", "time"] }


[lints]
workspace = true
