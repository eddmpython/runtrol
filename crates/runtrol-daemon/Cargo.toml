# The daemon: the composition root, the local listener, and request dispatch.
[package]
name = "runtrol-daemon"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
runtrol-security = { workspace = true }
runtrol-childproc = { workspace = true }
runtrol-store = { workspace = true }
runtrol-ipc = { workspace = true }
runtrol-core = { workspace = true }
runtrol-drivers = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
# Dispatch is asynchronous because opening a session is, so its tests need somewhere for that to run.
tokio = { workspace = true, features = ["rt", "macros"] }


[lints]
workspace = true
