# redb 스키마와 스키마 버전, 그리고 DB 파일을 여는 유일한 코드.
[package]
name = "runtrol-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
runtrol-provider = { workspace = true }
# Chosen for having no background threads at all, which is what keeps the idle budget honest. 4.1 is the
# floor: 4.0 lacks the region-allocator fix that cut resident memory by 68 percent, and anything before 4.0
# encodes variable-width tuples differently.
redb = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
